<link rel="stylesheet" href="style.css">

<!-- MAIN SCREEN CONTAINER -->
<div id="main-screen">
<h1>Object in school</h1>
<p>Take a guess?</p>
<button onclick="startGame()">Click here</button>
</div>


<!-- FEATURE 5: GUESSING GAME CONTENT -->
<div id="game-screen" class="hidden">
  <h2>Guessing Game</h2>
  <p>Can you guess the school object?</p>
  
  <!-- User guess input field -->
  <input type="text" id="user-guess" placeholder="Type your guess here">
  
  <!-- Submit button -->
  <button onclick="checkGuess()">Submit Guess</button>
  
  <!-- Feedback message area -->
  <p id="feedback"></p>

  <button onclick="resetGame()">Play Again</button>
</div>

<script src="script.js"></script>
